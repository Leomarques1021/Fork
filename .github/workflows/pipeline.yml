name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Inserir Secrets no JavaScript
        run: |
          echo "Nenhum segredo a ser inserido no código"

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # Secrets Scanning com Gitleaks
      # Escaneia o código e todo o histórico do Git em busca de segredos vazados
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      # SAST (Static Application Security Testing) com Semgrep
      # Analisa o código em busca de vulnerabilidades de segurança
      - name: 🔍 SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --config p/xss --error src/

      # SCA (Software Composition Analysis) com Grype
      # Escaneia dependências em busca de vulnerabilidades conhecidas (CVEs)
      - name: 📦 SCA - Grype
        run: |
          npm install --package-lock-only --no-audit --no-fund
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on medium

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          sha256sum artifact.tar > artifact.tar.sha256
          cat artifact.tar.sha256
          echo "SHA256 hash gerado para verificação de integridade"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ MOCK DE ASSINATURA
      # Este passo NÃO assina de verdade — ele gera um bundle falso, só para
      # demonstração.
      #
      # Dica da assinatura real:
      #   cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
      - name: ✍️ Assinar artefato
        run: |
          echo '{ "mock": "assinatura-invalida-para-demonstracao" }' > artifact.sigstore.json
          echo "Assinatura MOCK gerada."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4.1.3
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ VERIFICAÇÃO DE ASSINATURA DESABILITADA
      # A assinatura gerada no job anterior é MOCK (demonstração educacional)
      # Em produção, este passo validaria a assinatura real do artefato
      - name: 🔎 Verificar assinatura do artefato
        run: |
          echo "⚠️ Verificação de assinatura desabilitada (assinatura é MOCK para fins educacionais)"
          echo "Em produção, este comando validaria a assinatura:"
          echo "  cosign verify-blob artifact.tar --bundle artifact.sigstore.json ..."
          echo "Verificando integridade via hash SHA256..."
          sha256sum -c artifact.tar.sha256
          echo "✅ Hash verificado - artefato íntegro"

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4